<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- 禁止缩放 -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />

    <title>pankou</title>
    <style>
      /* 这是遮罩层，覆盖整个页面 */
      .qr-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        flex-direction: column;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      }

      /* 二维码显示区域 */
      .qr-container {
        background-color: white;
        padding: 25px;
        border-radius: 12px;
        text-align: center;
        max-width: 90%;
        margin-bottom: 20px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      /* 二维码图片样式 */
      .qr-container img {
        width: 80vw;
        max-width: 600px;
        height: auto;
        border-radius: 8px;
      }

      .qr-container p {
        color: #333;
        margin-top: 15px;
        font-size: 18px;
        font-weight: 500;
      }

      .info-panel {
        background-color: rgba(255, 255, 255, 0.1);
        padding: 20px;
        border-radius: 12px;
        max-width: 90%;
        text-align: center;
        backdrop-filter: blur(10px);
      }

      .info-panel h3 {
        margin-top: 0;
        margin-bottom: 15px;
        font-size: 22px;
      }

      .wallet-list {
        display: flex;
        gap: 15px;
        margin: 20px 0;
        justify-content: center;
        flex-wrap: wrap;
      }

      .wallet-tag {
        background-color: rgba(255, 255, 255, 0.2);
        padding: 10px 20px;
        border-radius: 25px;
        font-size: 16px;
        font-weight: 500;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .manual-check {
        margin-top: 20px;
      }

      .check-btn {
        background-color: #4a6cf7;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 500;
        transition: background-color 0.3s;
      }

      .check-btn:hover {
        background-color: #3a5ce5;
      }

      /* 隐藏遮罩层 */
      .hidden {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div class="qr-overlay" id="qrOverlay">
      <div class="qr-container">
        <img src="/walletconnect.png" alt="Wallet Connect QR Code" />
        <p>Scan the QR code to connect your wallet.</p>
      </div>
      
      <div class="info-panel">
        <h3>Supported Wallets</h3>
        <div class="wallet-list">
          <span class="wallet-tag">Onchain Wallet</span>
          <span class="wallet-tag">Base Wallet</span>
        </div>
        
        <p>If you're using a wallet browser but still see this page, click the button below to manually check:</p>
        
        <div class="manual-check">
          <button class="check-btn" id="manualCheck">Check Wallet Environment</button>
        </div>
      </div>
    </div>

    <!-- 网站其他内容 -->
    <div id="root"></div>

    <script>
      // 增强的钱包浏览器检测功能
      function isInWalletBrowser() {
        const userAgent = navigator.userAgent.toLowerCase();
        
        // 扩展钱包浏览器标识列表，特别是Onchain和Base钱包
        const walletIdentifiers = [
          'trustwallet',
          'metamask',
          'coinbasewallet',
          'tokenpocket',
          'safepal',
          'mathwallet',
          'bitkeep',
          'tpua',
          'dapp',
          'onchain', // Onchain钱包
          'basewallet', // Base钱包
          'base', // Base钱包可能的关键词
          'imtoken',
          'huobiwallet',
          'bitpie',
          'abcwallet',
          'wallet',
          'web3',
          'ethereum'
        ];
        
        // 检查用户代理是否包含钱包标识
        const isWalletUA = walletIdentifiers.some(identifier => 
          userAgent.includes(identifier)
        );
        
        // 检查是否存在以太坊提供者
        const hasEthereum = typeof window.ethereum !== 'undefined';
        
        // 检查是否存在Web3
        const hasWeb3 = typeof window.web3 !== 'undefined';
        
        // 综合判断：用户代理包含钱包标识 或 存在以太坊/Web3提供者
        return isWalletUA || hasEthereum || hasWeb3;
      }
      
      // 手动检查钱包环境
      function checkWalletEnvironment() {
        const userAgent = navigator.userAgent;
        const hasEthereum = typeof window.ethereum !== 'undefined';
        const hasWeb3 = typeof window.web3 !== 'undefined';
        
        let message = "Wallet Environment Detection Result:\n\n";
        message += `User Agent: ${userAgent}\n\n`;
        message += `Ethereum Provider Detected: ${hasEthereum ? 'Yes' : 'No'}\n`;
        message += `Web3 Detected: ${hasWeb3 ? 'Yes' : 'No'}\n\n`;
        
        if (hasEthereum) {
          message += `Ethereum Provider Information:\n`;
          message += `- Type: ${window.ethereum.constructor.name}\n`;
          if (window.ethereum.isMetaMask) message += "- MetaMask detected\n";
          if (window.ethereum.isTrust) message += "- Trust Wallet detected\n";
          if (window.ethereum.isCoinbaseWallet) message += "- Coinbase Wallet detected\n";
          if (window.ethereum.isRabby) message += "- Rabby Wallet detected\n";
          if (window.ethereum.isBraveWallet) message += "- Brave Wallet detected\n";
          
          // 检查是否有特定钱包的标识
          if (userAgent.toLowerCase().includes('onchain')) {
            message += "- Onchain Wallet detected\n";
          }
          if (userAgent.toLowerCase().includes('base')) {
            message += "- Base Wallet detected\n";
          }
        }
        
        alert(message);
        
        // 如果手动检查通过，允许进入
        if (hasEthereum || hasWeb3) {
          document.getElementById('qrOverlay').classList.add('hidden');
          
          // 存储检测结果，避免重复检测
          localStorage.setItem('walletDetected', 'true');
        }
      }
      
      // 页面加载时执行检测
      function performWalletDetection() {
        // 检查是否已经通过手动检测
        const walletDetected = localStorage.getItem('walletDetected');
        
        // 如果不在钱包浏览器中且未通过手动检测，显示二维码
        if (!isInWalletBrowser() && !walletDetected) {
          document.getElementById('qrOverlay').classList.remove('hidden');
        }
        // 如果在钱包浏览器中或已通过手动检测，隐藏二维码并允许访问
        else {
          document.getElementById('qrOverlay').classList.add('hidden');
        }
      }
      
      // 页面加载完成后执行检测
      document.addEventListener('DOMContentLoaded', function() {
        performWalletDetection();
        
        // 添加手动检查按钮事件
        const manualCheckBtn = document.getElementById('manualCheck');
        if (manualCheckBtn) {
          manualCheckBtn.addEventListener('click', checkWalletEnvironment);
        }
      });
      
      // 监听路由变化（适用于单页应用）
      let currentPath = window.location.pathname;
      
      // 监听URL变化（适用于单页应用）
      const observer = new MutationObserver(function() {
        if (window.location.pathname !== currentPath) {
          currentPath = window.location.pathname;
          // 路由变化时重新检测钱包环境
          performWalletDetection();
        }
      });
      
      // 开始观察
      observer.observe(document.body, {
        childList: true,
        subtree: true
      });
      
      // 监听popstate事件（浏览器前进/后退）
      window.addEventListener('popstate', function() {
        performWalletDetection();
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

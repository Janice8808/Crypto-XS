<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- 禁止缩放 -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />

    <title>pankou</title>
    <style>
      /* 这是遮罩层，覆盖整个页面 */
      .qr-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9); /* 半透明黑色 */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999; /* 保证在最上层 */
        flex-direction: column;
        color: white;
      }

      /* 二维码显示区域 */
      .qr-container {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        max-width: 90%;
        margin-bottom: 20px;
      }

      /* 二维码图片样式 */
      .qr-container img {
        width: 80vw;  /* 设置宽度为屏幕宽度的80% */
        max-width: 600px;  /* 最大宽度为600px */
        height: auto;  /* 保持图片比例 */
      }

      .info-panel {
        background-color: rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 10px;
        max-width: 90%;
        text-align: left;
      }

      .info-panel h3 {
        margin-top: 0;
        margin-bottom: 10px;
      }

      .wallet-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 15px 0;
        justify-content: center;
      }

      .wallet-tag {
        background-color: rgba(255, 255, 255, 0.2);
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 14px;
      }

      .manual-check {
        margin-top: 15px;
        text-align: center;
      }

      .check-btn {
        background-color: #4a6cf7;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
      }

      .check-btn:hover {
        background-color: #3a5ce5;
      }

      /* 隐藏遮罩层 */
      .hidden {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div class="qr-overlay" id="qrOverlay">
      <div class="qr-container">
        <!-- 使用 public 文件夹中的二维码图片 -->
        <img src="/walletconnect.png" alt="Wallet Connect QR Code" />
        <p>请扫描二维码连接你的钱包。</p>
      </div>
      
      <div class="info-panel">
        <h3>支持的钱包</h3>
        <div class="wallet-list">
          <span class="wallet-tag">MetaMask</span>
          <span class="wallet-tag">Trust Wallet</span>
          <span class="wallet-tag">Onchain Wallet</span>
          <span class="wallet-tag">Base Wallet</span>
          <span class="wallet-tag">Coinbase Wallet</span>
          <span class="wallet-tag">TokenPocket</span>
        </div>
        
        <p>如果您正在使用钱包浏览器但仍看到此页面，请点击下方按钮手动检查：</p>
        
        <div class="manual-check">
          <button class="check-btn" id="manualCheck">手动检查钱包环境</button>
        </div>
      </div>
    </div>

    <!-- 网站其他内容 -->
    <div id="root"></div>

    <script>
      // 增强的钱包浏览器检测功能
      function isInWalletBrowser() {
        const userAgent = navigator.userAgent.toLowerCase();
        
        // 扩展钱包浏览器标识列表，特别是Onchain和Base钱包
        const walletIdentifiers = [
          'trustwallet',
          'metamask',
          'coinbasewallet',
          'tokenpocket',
          'safepal',
          'mathwallet',
          'bitkeep',
          'tpua',
          'dapp',
          'onchain', // Onchain钱包
          'basewallet', // Base钱包
          'base', // Base钱包可能的关键词
          'imtoken',
          'huobiwallet',
          'bitpie',
          'abcwallet',
          'wallet',
          'web3',
          'ethereum'
        ];
        
        // 检查用户代理是否包含钱包标识
        const isWalletUA = walletIdentifiers.some(identifier => 
          userAgent.includes(identifier)
        );
        
        // 检查是否存在以太坊提供者
        const hasEthereum = typeof window.ethereum !== 'undefined';
        
        // 检查是否存在Web3
        const hasWeb3 = typeof window.web3 !== 'undefined';
        
        // 综合判断：用户代理包含钱包标识 或 存在以太坊/Web3提供者
        return isWalletUA || hasEthereum || hasWeb3;
      }
      
      // 手动检查钱包环境
      function checkWalletEnvironment() {
        const userAgent = navigator.userAgent;
        const hasEthereum = typeof window.ethereum !== 'undefined';
        const hasWeb3 = typeof window.web3 !== 'undefined';
        
        let message = "钱包环境检测结果:\n\n";
        message += `用户代理: ${userAgent}\n\n`;
        message += `检测到以太坊提供者: ${hasEthereum ? '是' : '否'}\n`;
        message += `检测到Web3: ${hasWeb3 ? '是' : '否'}\n\n`;
        
        if (hasEthereum) {
          message += `以太坊提供者信息:\n`;
          message += `- 类型: ${window.ethereum.constructor.name}\n`;
          if (window.ethereum.isMetaMask) message += "- 检测到MetaMask\n";
          if (window.ethereum.isTrust) message += "- 检测到Trust Wallet\n";
          if (window.ethereum.isCoinbaseWallet) message += "- 检测到Coinbase Wallet\n";
          if (window.ethereum.isRabby) message += "- 检测到Rabby Wallet\n";
          if (window.ethereum.isBraveWallet) message += "- 检测到Brave Wallet\n";
          
          // 检查是否有特定钱包的标识
          if (userAgent.toLowerCase().includes('onchain')) {
            message += "- 检测到Onchain Wallet\n";
          }
          if (userAgent.toLowerCase().includes('base')) {
            message += "- 检测到Base Wallet\n";
          }
        }
        
        alert(message);
        
        // 如果手动检查通过，允许进入
        if (hasEthereum || hasWeb3) {
          document.getElementById('qrOverlay').classList.add('hidden');
          
          // 存储检测结果，避免重复检测
          sessionStorage.setItem('walletDetected', 'true');
        }
      }
      
      // 检查当前页面是否是首页
      if (window.location.pathname === "/") {
        // 检查是否已经通过手动检测
        const walletDetected = sessionStorage.getItem('walletDetected');
        
        // 如果不在钱包浏览器中且未通过手动检测，显示二维码
        if (!isInWalletBrowser() && !walletDetected) {
          document.getElementById('qrOverlay').classList.remove('hidden');
        }
        // 如果在钱包浏览器中或已通过手动检测，隐藏二维码并允许访问
        else {
          document.getElementById('qrOverlay').classList.add('hidden');
        }
      }
      
      // 添加手动检查按钮事件
      document.addEventListener('DOMContentLoaded', function() {
        const manualCheckBtn = document.getElementById('manualCheck');
        if (manualCheckBtn) {
          manualCheckBtn.addEventListener('click', checkWalletEnvironment);
        }
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

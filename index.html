<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- 禁止缩放 -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />

    <title>pankou</title>
    <style>
      /* 这是遮罩层，覆盖整个页面 */
      .qr-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8); /* 半透明黑色 */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999; /* 保证在最上层 */
      }

      /* 二维码显示区域 */
      .qr-container {
        background-color: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
      }

      /* 放大二维码图片，确保图片不超出容器 */
      .qr-container img {
        width: 80vw;  /* 设置宽度为屏幕宽度的80% */
        max-width: 600px;  /* 最大宽度为600px */
        height: auto;  /* 保持图片比例 */
      }

      /* 隐藏在手机端 */
      @media (max-width: 768px) {
        .qr-overlay {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <!-- 二维码弹窗 -->
    <div class="qr-overlay" id="qrOverlay">
      <div class="qr-container">
        <!-- 使用 public 文件夹中的二维码图片 -->
        <img src="/walletconnect.png" alt="Wallet Connect QR Code" />
        <p>请扫描二维码连接你的钱包。</p>
      </div>
    </div>

    <!-- 网站其他内容 -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- 禁止缩放 -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />

    <title>pankou</title>
    <style>
      /* 这是遮罩层，覆盖整个页面 */
      .qr-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        flex-direction: column;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      }

      /* 二维码显示区域 */
      .qr-container {
        background-color: white;
        padding: 25px;
        border-radius: 12px;
        text-align: center;
        max-width: 90%;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      /* 二维码图片样式 */
      .qr-container img {
        width: 80vw;
        max-width: 600px;
        height: auto;
        border-radius: 8px;
      }

      .qr-container p {
        color: #333;
        margin-top: 15px;
        font-size: 18px;
        font-weight: 500;
      }

      /* 隐藏遮罩层 */
      .hidden {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div class="qr-overlay" id="qrOverlay">
      <div class="qr-container">
        <img src="/walletconnect.png" alt="Wallet Connect QR Code" />
        <p>Scan the QR code to connect your wallet.</p>
      </div>
    </div>

    <!-- 网站其他内容 -->
    <div id="root"></div>

    <script>
      // 增强的钱包浏览器检测功能
      function isInWalletBrowser() {
        const userAgent = navigator.userAgent.toLowerCase();
        
        // 扩展钱包浏览器标识列表，特别是Onchain和Base钱包
        const walletIdentifiers = [
          'trustwallet',
          'metamask',
          'coinbasewallet',
          'tokenpocket',
          'safepal',
          'mathwallet',
          'bitkeep',
          'tpua',
          'dapp',
          'onchain', // Onchain钱包
          'basewallet', // Base钱包
          'base', // Base钱包可能的关键词
          'imtoken',
          'huobiwallet',
          'bitpie',
          'abcwallet',
          'wallet',
          'web3',
          'ethereum'
        ];
        
        // 检查用户代理是否包含钱包标识
        const isWalletUA = walletIdentifiers.some(identifier => 
          userAgent.includes(identifier)
        );
        
        // 检查是否存在以太坊提供者
        const hasEthereum = typeof window.ethereum !== 'undefined';
        
        // 检查是否存在Web3
        const hasWeb3 = typeof window.web3 !== 'undefined';
        
        // 综合判断：用户代理包含钱包标识 或 存在以太坊/Web3提供者
        return isWalletUA || hasEthereum || hasWeb3;
      }
      
      // 页面加载时执行检测
      function performWalletDetection() {
        // 检查是否已经通过检测
        const walletDetected = sessionStorage.getItem('walletDetected');
        
        // 如果不在钱包浏览器中且未通过检测，显示二维码
        if (!isInWalletBrowser() && !walletDetected) {
          document.getElementById('qrOverlay').classList.remove('hidden');
        }
        // 如果在钱包浏览器中或已通过检测，隐藏二维码并允许访问
        else {
          document.getElementById('qrOverlay').classList.add('hidden');
          // 存储检测结果，避免重复检测
          sessionStorage.setItem('walletDetected', 'true');
        }
      }
      
      // 页面加载完成后执行检测
      document.addEventListener('DOMContentLoaded', function() {
        performWalletDetection();
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

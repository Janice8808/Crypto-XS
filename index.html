<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- 禁止缩放 -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />

    <title>pankou</title>
    <style>
      /* 这是遮罩层，覆盖整个页面 */
      .qr-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        flex-direction: column;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      }

      /* 二维码显示区域 */
      .qr-container {
        background-color: white;
        padding: 25px;
        border-radius: 12px;
        text-align: center;
        max-width: 90%;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      /* 二维码图片样式 */
      .qr-container img {
        width: 80vw;
        max-width: 600px;
        height: auto;
        border-radius: 8px;
      }

      .qr-container p {
        color: #333;
        margin-top: 15px;
        font-size: 18px;
        font-weight: 500;
      }

      /* 隐藏遮罩层 */
      .hidden {
        display: none !important;
      }
      
      /* 确保页面从顶部开始 */
      html, body {
        scroll-behavior: smooth;
      }
      
      /* 主应用内容区域 */
      #root {
        min-height: 100vh;
      }
    </style>
  </head>

  <body>
    <div class="qr-overlay hidden" id="qrOverlay">
      <div class="qr-container">
        <img src="/walletconnect.png" alt="Wallet Connect QR Code" />
        <p>Scan the QR code to connect your wallet.</p>
      </div>
    </div>

    <!-- 网站其他内容 -->
    <div id="root"></div>

    <script>
      // 增强的钱包浏览器检测功能
      function isInWalletBrowser() {
        const ua = navigator.userAgent.toLowerCase();

        const walletIdentifiers = [
          'trust', 'metamask', 'coinbase', 'tokenpocket',
          'safepal', 'mathwallet', 'bitkeep', 'tpwallet',
          'onchain', 'basewallet', 'imtoken', 'huobiwallet',
          'bitpie', 'abcwallet', 'web3', 'ethereum'
        ];

        // UA 包含钱包关键字 → 100% 钱包内置浏览器
        const uaMatch = walletIdentifiers.some(id => ua.includes(id));

        // window.ethereum 是最强标志，几乎所有钱包内置浏览器都有
        const injected = typeof window.ethereum !== 'undefined';

        return uaMatch || injected;
      }
      
      // 页面加载时执行检测
      function performWalletDetection() {
        const qr = document.getElementById('qrOverlay');

        if (isInWalletBrowser()) {
          // 钱包内置浏览器：绝对不显示
          qr.classList.add('hidden');
          sessionStorage.setItem('walletDetected', 'true');
        } else {
          // 普通浏览器 → 显示二维码
          qr.classList.remove('hidden');
        }
      }
      
      // 确保页面始终从顶部开始
      function ensurePageStartsAtTop() {
        // 立即滚动到顶部
        window.scrollTo(0, 0);
        
        // 防止页面加载时的滚动行为
        if (history.scrollRestoration) {
          history.scrollRestoration = 'manual';
        }
        
        // 监听路由变化（适用于单页应用）
        let currentPath = window.location.pathname;
        const observer = new MutationObserver(function() {
          if (window.location.pathname !== currentPath) {
            currentPath = window.location.pathname;
            // 路由变化时滚动到顶部
            setTimeout(() => {
              window.scrollTo(0, 0);
            }, 0);
          }
        });
        
        // 开始观察
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
        
        // 监听popstate事件（浏览器前进/后退）
        window.addEventListener('popstate', function() {
          setTimeout(() => {
            window.scrollTo(0, 0);
          }, 0);
        });
        
        // 监听hashchange事件
        window.addEventListener('hashchange', function() {
          setTimeout(() => {
            window.scrollTo(0, 0);
          }, 0);
        });
      }

      // 全局事件委托处理所有使用了 stopPropagation 的按钮
      function initGlobalEventDelegation() {
        console.log('初始化全局事件委托');
        
        // 处理所有返回按钮的点击事件
        document.body.addEventListener('click', function(e) {
          // 匹配所有包含 back-btn 类的元素
          if (e.target.matches('.back-btn') || e.target.closest('.back-btn')) {
            console.log('返回按钮被点击');
            e.stopPropagation();
            e.preventDefault();
            
            // 执行返回逻辑
            if (window.history.length > 1) {
              window.history.back();
            } else {
              // 如果没有历史记录，回到首页或其他默认页面
              window.location.href = '/';
            }
          }
          
          // 匹配所有包含 close-btn 类的元素（关闭按钮）
          if (e.target.matches('.close-btn') || e.target.closest('.close-btn')) {
            console.log('关闭按钮被点击');
            e.stopPropagation();
            e.preventDefault();
            
            // 执行关闭逻辑，比如关闭模态框
            const modal = e.target.closest('.modal') || document.querySelector('.modal.active');
            if (modal) {
              modal.classList.remove('active');
              modal.style.display = 'none';
            }
          }
        });
        
        // 处理键盘事件（ESC键等）
        document.addEventListener('keydown', function(e) {
          // ESC键处理
          if (e.key === 'Escape') {
            console.log('ESC键被按下');
            e.stopPropagation();
            
            // 关闭活动的模态框或菜单
            const activeModal = document.querySelector('.modal.active, .overlay.active, .dropdown.active');
            if (activeModal) {
              activeModal.classList.remove('active');
              activeModal.style.display = 'none';
            }
          }
          
          // 回车键在特定上下文中
          if (e.key === 'Enter' && (e.target.matches('.confirm-btn') || e.target.closest('.confirm-btn'))) {
            e.stopPropagation();
            // 确认逻辑
          }
        });
      }
      
      // 页面加载完成后执行所有初始化
      document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM内容加载完成');
        performWalletDetection();
        ensurePageStartsAtTop();
        initGlobalEventDelegation();
      });
      
      // 如果页面已经加载完成，立即执行
      if (document.readyState === 'complete') {
        console.log('页面已加载完成，立即执行初始化');
        performWalletDetection();
        ensurePageStartsAtTop();
        initGlobalEventDelegation();
      }

      // 监听页面显示事件（从缓存中恢复时）
      window.addEventListener('pageshow', function(e) {
        console.log('页面显示');
        if (e.persisted) {
          // 页面从缓存中恢复，重新初始化事件
          initGlobalEventDelegation();
        }
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

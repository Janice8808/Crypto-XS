<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- 禁止缩放 -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />

    <title>pankou</title>
    <style>
      #content {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      #qrImage {
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="content"></div>  <!-- 用于显示图片 -->
    <script>
      // 判断是否为手机设备
      function isMobile() {
        return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      }

      // 如果是手机设备，正常加载网站内容
      if (isMobile()) {
        // 加载 React 应用
        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/src/main.jsx';  // React 应用的入口文件路径
        document.body.appendChild(script);

        // 跳转到网站
        window.location.href = "https://你的网址.com";  // 替换为你的网站链接
      } else {
        // 如果是电脑设备，显示图片，并阻止进一步操作
        const contentDiv = document.getElementById('content');
        const img = document.createElement('img');
        img.id = 'qrImage';
        img.src = '/walletconnect.png';  // 图片路径
        img.alt = 'QR Code';

        contentDiv.appendChild(img);
      }
    </script>
  </body>
</html>

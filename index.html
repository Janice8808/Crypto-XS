<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- 禁止缩放 -->
    <meta 
      name="viewport" 
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />

    <title>pankou</title>
    <style>
      /* 这是遮罩层，覆盖整个页面 */
      .qr-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        flex-direction: column;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      }

      /* 二维码显示区域 */
      .qr-container {
        background-color: white;
        padding: 25px;
        border-radius: 12px;
        text-align: center;
        max-width: 90%;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      /* 二维码图片样式 */
      .qr-container img {
        width: 80vw;
        max-width: 600px;
        height: auto;
        border-radius: 8px;
      }

      .qr-container p {
        color: #333;
        margin-top: 15px;
        font-size: 18px;
        font-weight: 500;
      }

      /* 隐藏遮罩层 */
      .hidden {
        display: none !important;
      }
      
      /* 确保页面从顶部开始 */
      html, body {
        scroll-behavior: smooth;
      }
      
      /* 主应用内容区域 */
      #root {
        min-height: 100vh;
      }
    </style>
  </head>

  <body>
<div class="qr-overlay hidden" id="qrOverlay">
  <div class="qr-container">
    <img src="/walletconnect.png" alt="Wallet Connect QR Code" />
    <p>Scan the QR code to connect your wallet.</p>
  </div>
</div>


    <!-- 网站其他内容 -->
    <div id="root"></div>

    <script>
      // 增强的钱包浏览器检测功能
function isInWalletBrowser() {
  const ua = navigator.userAgent.toLowerCase();

  const walletIdentifiers = [
    'trust', 'metamask', 'coinbase', 'tokenpocket',
    'safepal', 'mathwallet', 'bitkeep', 'tpwallet',
    'onchain', 'basewallet', 'imtoken', 'huobiwallet',
    'bitpie', 'abcwallet', 'web3', 'ethereum'
  ];

  // UA 包含钱包关键字 → 100% 钱包内置浏览器
  const uaMatch = walletIdentifiers.some(id => ua.includes(id));

  // window.ethereum 是最强标志，几乎所有钱包内置浏览器都有
  const injected = typeof window.ethereum !== 'undefined';

  return uaMatch || injected;
}

      
      // 页面加载时执行检测
function performWalletDetection() {
  const qr = document.getElementById('qrOverlay');

  if (isInWalletBrowser()) {
    // 钱包内置浏览器：绝对不显示
    qr.classList.add('hidden');
    sessionStorage.setItem('walletDetected', 'true');
  } else {
    // 普通浏览器 → 显示二维码
    qr.classList.remove('hidden');
  }
}

      
      // 确保页面始终从顶部开始
      function ensurePageStartsAtTop() {
        // 立即滚动到顶部
        window.scrollTo(0, 0);
        
        // 防止页面加载时的滚动行为
        if (history.scrollRestoration) {
          history.scrollRestoration = 'manual';
        }
        
        // 监听路由变化（适用于单页应用）
        let currentPath = window.location.pathname;
        const observer = new MutationObserver(function() {
          if (window.location.pathname !== currentPath) {
            currentPath = window.location.pathname;
            // 路由变化时滚动到顶部
            setTimeout(() => {
              window.scrollTo(0, 0);
            }, 0);
          }
        });
        
        // 开始观察
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
        
        // 监听popstate事件（浏览器前进/后退）
        window.addEventListener('popstate', function() {
          setTimeout(() => {
            window.scrollTo(0, 0);
          }, 0);
        });
        
        // 监听hashchange事件
        window.addEventListener('hashchange', function() {
          setTimeout(() => {
            window.scrollTo(0, 0);
          }, 0);
        });
      }
      
      // 页面加载完成后执行检测和滚动到顶部
      document.addEventListener('DOMContentLoaded', function() {
        performWalletDetection();
        ensurePageStartsAtTop();
      });
      
      // 如果页面已经加载完成，立即执行
      if (document.readyState === 'complete') {
        performWalletDetection();
        ensurePageStartsAtTop();
      }
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
